name: ci

# 门禁 4.x「CI 门禁存在性」的落地实现：
#   gates         -> gofmt / go vet / go build / go test（windows + ubuntu 双 runner，覆盖平台分层）
#   coverage      -> 覆盖率产物上传 + 核心包阈值（门禁 3.x「覆盖率口径」）
#   cross-compile -> linux / macOS 交叉编译（门禁 3.x「跨平台编译校验」）
#   plugin-smoke  -> DSH 插件语法检查与 stub 冒烟（门禁 4.x「插件冒烟校验」）
#
# macOS additions (REQ-008): cross-compiling darwin only type-checks the code, it
# never executes the non-Windows branches. These jobs run on real darwin machines.
#   gates-macos       -> darwin/arm64: gofmt / vet / build / tests, on every push
#   gates-macos-intel -> darwin/amd64: the same, at release points and on batch branches
#   e2e-macos         -> darwin end-to-end install / activate / inspect / uninstall,
#                        at release points, on manual dispatch, or on a batch
#                        branch (it downloads a runtime)
#
# release-pipeline evidence (REQ-008 batch 4), also release points / dispatch / batch branches:
#   release-assets    -> lays out the six-target asset set and checks it (publishes nothing)
#   native-smoke      -> builds each published target on a native runner, runs it, runs the whole
#                        test suite there, and compares the bytes with the cross-built asset
#   e2e-linux         -> linux/amd64 + linux/arm64 end-to-end (install / activate / inspect /
#                        uninstall against the public upstream sources)
#   e2e-windows-arm   -> the windows/arm64 half of NFR-806, same end-to-end in PowerShell
#
# runtime matrix (REQ-009 B3): ci/e2e-runtimes.tsv lists every runtime once;
#   e2e-matrix-prepare -> turns that table into a matrix (changed rows only off a tag)
#   e2e-runtime       -> one job per row, wall clock = the slowest row
#   e2e-all           -> manual lane: every runtime in one data root and one shell

on:
  push:
    branches: ["develop-v*", main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt must be clean
        shell: bash
        run: |
          fmt=$(gofmt -l ./cmd ./internal)
          if [ -n "$fmt" ]; then
            echo "gofmt would change:"
            echo "$fmt"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        shell: bash
        run: |
          # 失败时把失败测试打印成 ::error:: 注解（可从 Actions API 读到，便于定位）
          # A skipped test logs its reason in the same shape as a failed
          # assertion, so annotations come from the --- FAIL blocks (and from
          # panics) rather than from every "file.go:12:" line.
          set +e
          go test ./... -count=1 -v > test-output.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::go test failed (exit $code)"
            {
              awk '/^=== RUN   /{buf="";inbuf=1} inbuf{buf=buf $0 "\n"} /^--- FAIL: /{printf "%s",buf;inbuf=0;buf=""}' test-output.log
              grep -E '^panic:' test-output.log
            } | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done
            echo '----- tail -----'
            tail -n 40 test-output.log
          fi
          exit $code

  gates-macos:
    name: gates (macos-15, darwin/arm64)
    # Real-machine darwin/arm64 evidence. The ubuntu legs already run the
    # non-Windows code, but only here does it execute on the platform the code
    # claims to support, with the macOS toolchain and filesystem semantics.
    # Public repositories do not pay for macOS runner minutes, so this is part
    # of the everyday gate.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt must be clean
        run: |
          fmt=$(gofmt -l ./cmd ./internal)
          if [ -n "$fmt" ]; then
            echo "gofmt would change:"
            echo "$fmt"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: the darwin/arm64 binary is static and actually runs
        run: |
          # Building proves nothing about the result, so one binary is built,
          # run, and checked for a C library dependency (FR-801).
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o "$RUNNER_TEMP/ployenv" ./cmd/ployenv
          "$RUNNER_TEMP/ployenv" --version
          if go version -m "$RUNNER_TEMP/ployenv" | grep -q 'cgo'; then
            echo "::error::the darwin/arm64 binary is not static (cgo is linked in)"
            exit 1
          fi
          # A Mach-O executable always carries dyld, so what is asserted here is
          # that no library outside the system ones got linked in.
          if otool -L "$RUNNER_TEMP/ployenv" | tail -n +2 | grep -q -v -E '^[[:space:]]*(/usr/lib/|/System/)'; then
            echo "::error::the darwin/arm64 binary links a non-system library"
            otool -L "$RUNNER_TEMP/ployenv"
            exit 1
          fi
          echo "PASS statically linked"
      - name: go test
        run: |
          # Failures are printed as ::error:: annotations so they can be read
          # back from the Actions API. A skipped test logs its reason in the
          # same shape as a failed assertion, so annotations come from the
          # --- FAIL blocks (and from panics) rather than from every
          # "file.go:12:" line.
          set +e
          go test ./... -count=1 -v > test-output.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::go test failed (exit $code)"
            {
              awk '/^=== RUN   /{buf="";inbuf=1} inbuf{buf=buf $0 "\n"} /^--- FAIL: /{printf "%s",buf;inbuf=0;buf=""}' test-output.log
              grep -E '^panic:' test-output.log
            } | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done
            echo '----- tail -----'
            tail -n 40 test-output.log
          fi
          exit $code

  gates-macos-intel:
    name: gates (macos-15-intel, darwin/amd64)
    # The same gate for the Intel half of darwin. It is not part of the everyday
    # gate because macos-15-intel is the slowest runner to schedule, and the code
    # it exercises is the same darwin code the arm64 job already covers; the
    # distinct value here is the darwin/amd64 architecture itself.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || startsWith(github.ref, 'refs/heads/develop-v')
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt must be clean
        run: |
          fmt=$(gofmt -l ./cmd ./internal)
          if [ -n "$fmt" ]; then
            echo "gofmt would change:"
            echo "$fmt"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: the darwin/amd64 binary is static and actually runs
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o "$RUNNER_TEMP/ployenv" ./cmd/ployenv
          "$RUNNER_TEMP/ployenv" --version
          if go version -m "$RUNNER_TEMP/ployenv" | grep -q 'cgo'; then
            echo "::error::the darwin/amd64 binary is not static (cgo is linked in)"
            exit 1
          fi
          if otool -L "$RUNNER_TEMP/ployenv" | tail -n +2 | grep -q -v -E '^[[:space:]]*(/usr/lib/|/System/)'; then
            echo "::error::the darwin/amd64 binary links a non-system library"
            otool -L "$RUNNER_TEMP/ployenv"
            exit 1
          fi
          echo "PASS statically linked"
      - name: go test
        run: |
          # Failures are printed as ::error:: annotations so they can be read
          # back from the Actions API. A skipped test logs its reason in the
          # same shape as a failed assertion, so annotations come from the
          # --- FAIL blocks (and from panics) rather than from every
          # "file.go:12:" line.
          set +e
          go test ./... -count=1 -v > test-output.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::go test failed (exit $code)"
            {
              awk '/^=== RUN   /{buf="";inbuf=1} inbuf{buf=buf $0 "\n"} /^--- FAIL: /{printf "%s",buf;inbuf=0;buf=""}' test-output.log
              grep -E '^panic:' test-output.log
            } | head -n 40 | while IFS= read -r line; do echo "::error::$line"; done
            echo '----- tail -----'
            tail -n 40 test-output.log
          fi
          exit $code

  coverage:
    name: coverage (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: unit tests with coverage
        shell: bash
        run: go test ./... -count=1 -coverprofile=coverage.out
      - name: package coverage floors + ratchet
        shell: bash
        run: |
          # 覆盖率在 windows-latest 度量：internal/platform 的测试是 Windows 专属
          # （link_windows_test.go），在 ubuntu 上该包没有测试文件、覆盖率提取为空。
          # 提取不到覆盖率的包按“本平台无测试”跳过，不判失败。
          check_one() {
            out=$(go test "$1" -count=1 -cover 2>&1 || true)
            got=$(printf '%s\n' "$out" | sed -n 's/.*coverage: \([0-9.]*\)%.*/\1/p' | head -1)
            if [ -z "$got" ]; then
              echo "$1: no coverage on this platform - skipped"
              return 0
            fi
            echo "$1 coverage: $got% (floor $2%)"
            awk -v c="$got" -v m="$2" 'BEGIN { if (c + 0 < m + 0) exit 1 }' || return 1
          }
          ok=0
          check_one ./internal/jsonx/... 80    || ok=1
          check_one ./internal/version/... 80  || ok=1
          check_one ./internal/platform/... 50 || ok=1
          check_one ./internal/archive/... 40  || ok=1
          # REQ-005 batch 1: netx went 6.8% -> 87.2% on 2026-10-11 (floor keeps a 12 point margin).
          check_one ./internal/netx/... 75    || ok=1
          # REQ-005 lifted these packages a long way (runtime 93.5, fsutil 87.0,
          # cli 92.3, install 83.1, config 93.3, logx 99.1 on 2026-10-12), but the
          # owner asked for a lighter bar: the floors stay at the requirement targets,
          # so they catch a real regression without forcing a high score. The tests
          # themselves stay in the tree.
          # cmd/ployenv is deliberately NOT gated: one statement, covered by the smoke.
          check_one ./internal/runtime/... 40 || ok=1
          check_one ./internal/fsutil/... 50  || ok=1
          check_one ./internal/cli/... 45     || ok=1
          check_one ./internal/install/... 45 || ok=1
          check_one ./internal/config/... 30  || ok=1
          check_one ./internal/logx/... 30    || ok=1

          go test ./internal/cli/... ./internal/platform/... ./internal/install/... ./internal/jsonx/... ./internal/version/... -count=1 -coverprofile=core.out
          total=$(go tool cover -func=core.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          # REQ-005: the ratchet only goes up, in steps below the measured value
          # REQ-005: the ratchet only goes up, in steps below the measured value
          # (87.4% on 2026-10-12, after cli and install were covered) so runner jitter
          # cannot fail the gate.
          # Reported only: the owner asked for a lighter bar (2026-10-12), so the combined
          # number no longer fails the job. The per-package floors above still catch a real
          # regression, which is what this gate is for.
          echo "core combined coverage: $total% (reported, no floor)"

          [ "$ok" = "0" ] || { echo "coverage gate failed"; exit 1; }
      - name: upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            core.out
  cross-compile:
    name: cross compile (linux / macOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: build all targets
        run: |
          # CGO pinned off: the published binaries are meant to be static
          # (REQ-008 FR-801), and leaving it to the runner makes the result
          # depend on whether a C toolchain happens to be installed.
          export CGO_ENABLED=0
          GOOS=linux  GOARCH=amd64 go build ./...
          GOOS=linux  GOARCH=arm64 go build ./...
          GOOS=darwin GOARCH=amd64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
      - name: linux/amd64 artifact is static and actually runs
        run: |
          # Compiling proves nothing about the result, so one target is built
          # for real, run, and checked for a cgo dependency (FR-801).
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o /tmp/ployenv-linux-amd64 ./cmd/ployenv
          /tmp/ployenv-linux-amd64 --version
          if go version -m /tmp/ployenv-linux-amd64 | grep -q 'cgo'; then
            echo "::error::the linux/amd64 binary is not static (cgo is linked in)"
            exit 1
          fi
          if ldd /tmp/ployenv-linux-amd64 2>&1 | grep -q 'not a dynamic executable'; then
            echo "PASS statically linked"
          else
            echo "::error::the linux/amd64 binary is dynamically linked"
            ldd /tmp/ployenv-linux-amd64 || true
            exit 1
          fi

  release-assets:
    name: release assets (dry run)
    # REQ-008 FR-802: the packaging the release workflow publishes, run on a batch branch and at
    # every release point, so the six-target asset set is machine-checked long before a tag exists.
    # Nothing is published here - the artifact kept below is the checksums file only.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || startsWith(github.ref, 'refs/heads/develop-v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: lay out the release assets for all six targets
        shell: pwsh
        run: ./build.ps1 -Package
      - name: the checksums file must cover every asset
        shell: pwsh
        run: |
          $dir = 'dist/release'
          $entries = @(Get-Content -LiteralPath "$dir/SHA256SUMS.txt" | Where-Object { $_ -ne '' -and -not $_.StartsWith('#') })
          if ($entries.Count -ne 13) { throw "SHA256SUMS.txt holds $($entries.Count) entries, expected 13" }
          foreach ($line in $entries) {
            if ($line -notmatch '^([0-9A-Fa-f]{64})\s+(.+)$') { throw "malformed line in SHA256SUMS.txt: $line" }
            $path = Join-Path $dir $Matches[2].Trim()
            if (-not (Test-Path -LiteralPath $path)) { throw "listed but missing: $path" }
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $Matches[1]) { throw "hash mismatch for $path" }
          }
          $files = @(Get-ChildItem -LiteralPath $dir -File).Count
          if ($files -ne 14) { throw "expected 14 files in ${dir}, found $files" }
          Write-Host 'PASS six-target asset set  13 checksummed entries over 14 files'
      - name: keep the checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-sums
          path: dist/release/SHA256SUMS.txt
          if-no-files-found: warn

  native-smoke:
    name: native smoke (${{ matrix.target }})
    # REQ-008 NFR-806: the binary we publish has to be run on the platform it claims *before* the
    # release, not after it. Each leg builds its own target on a native runner and runs it; the
    # digest comparison at the end is the reproducibility claim the whole multi-platform
    # arrangement rests on - same clean tree, same commit, same flags, two different toolchains.
    needs: release-assets
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || startsWith(github.ref, 'refs/heads/develop-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, target: windows-amd64, goos: windows, goarch: amd64, ext: '.exe' }
          - { runner: windows-11-arm, target: windows-arm64, goos: windows, goarch: arm64, ext: '.exe' }
          - { runner: ubuntu-latest, target: linux-amd64, goos: linux, goarch: amd64, ext: '' }
          - { runner: ubuntu-24.04-arm, target: linux-arm64, goos: linux, goarch: arm64, ext: '' }
          - { runner: macos-15-intel, target: darwin-amd64, goos: darwin, goarch: amd64, ext: '' }
          - { runner: macos-15, target: darwin-arm64, goos: darwin, goarch: arm64, ext: '' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: build this target natively, then run it
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $bin = './ployenv-native' + '${{ matrix.ext }}'
          go build -trimpath -ldflags '-s -w' -o $bin ./cmd/ployenv
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          $reported = (& $bin --version | Out-String).Trim()
          Write-Host "native --version: $reported"
          $want = '${{ matrix.goos }}/${{ matrix.goarch }}'
          if ($reported -notmatch '\(([^)]+)\)\s*$') { throw "unexpected --version output: $reported" }
          if ($Matches[1] -ne $want) { throw "this runner reports $($Matches[1]), expected $want" }
          Write-Host "PASS native-run  $reported"
          $meta = (& go version -m $bin | Out-String)
          if ($meta -match 'runtime/cgo') { throw 'the binary links cgo; the published ones must be static' }
          Write-Host 'PASS no-cgo'
          if ($want -like 'linux/*') {
            $ldd = (& ldd $bin 2>&1 | Out-String)
            if ($ldd -notmatch 'not a dynamic executable') { throw "not statically linked: $ldd" }
            Write-Host 'PASS static (ldd)'
            # GNU ldd reports a static binary as "not a dynamic executable" and exits 1, and the
            # runner turns a lingering $LASTEXITCODE into the exit code of the whole step - so a
            # step where every check passed would still be reported as failed.
            $LASTEXITCODE = 0
          }
          if ($want -like 'darwin/*') {
            $libs = @(& otool -L $bin | Select-Object -Skip 1 | Where-Object { $_.Trim() -ne '' -and $_ -notmatch '^\s*(/usr/lib/|/System/)' })
            if ($libs.Count -gt 0) { throw "the darwin binary links non-system libraries: $($libs -join '; ')" }
            Write-Host 'PASS no non-system dylib'
          }
          $LASTEXITCODE = 0
      - name: the whole test suite, executed on this platform
        shell: pwsh
        run: |
          # Building and running --version only exercises main(); NFR-806 wants the platform's code
          # paths actually executed, and on darwin/windows the tests that are skipped elsewhere run
          # here. Same flags as the packaging: CGO off, so the result matches the published binaries.
          $env:CGO_ENABLED = '0'
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { throw "go test failed on this platform (exit $LASTEXITCODE)" }
          Write-Host 'PASS go test ./... on the native runner'
          $LASTEXITCODE = 0
      - uses: actions/download-artifact@v4
        with:
          name: release-sums
          path: dist-sums
      - name: the cross-built asset must be the same bytes as this native build
        shell: pwsh
        run: |
          # windows/amd64 is excluded on purpose: its published asset is the binary committed in the
          # repository (option B), never a build of this tree, so no rebuild can match it. That
          # anchor is owned by build.ps1 -Package and by the asset checker (R3/R11), not here.
          if ('${{ matrix.target }}' -eq 'windows-amd64') {
            Write-Host 'SKIP packaged-equals-native  windows/amd64 ships the committed binary (option B)'
            $LASTEXITCODE = 0
            exit 0
          }
          $sums = 'dist-sums/SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $sums)) { throw "the checksums artifact is missing: $sums" }
          $name = 'ployenv-' + '${{ matrix.target }}' + '${{ matrix.ext }}'
          $want = $null
          foreach ($line in (Get-Content -LiteralPath $sums)) {
            if ($line -match '^([0-9A-Fa-f]{64})\s+(.+)$' -and $Matches[2].Trim() -eq $name) { $want = $Matches[1] }
          }
          if ($null -eq $want) { throw "SHA256SUMS.txt does not list $name" }
          $got = (Get-FileHash -LiteralPath ('./ployenv-native' + '${{ matrix.ext }}') -Algorithm SHA256).Hash
          if ($got -ne $want) { throw "$name is $want as published but $got when built natively on this runner" }
          Write-Host "PASS packaged-equals-native  $name $got (cross build and native build agree byte for byte)"

  e2e-linux:
    name: e2e linux (${{ matrix.arch }})
    # The end-to-end acceptance is deliberately NOT part of the everyday gate: it
    # downloads a runtime. It runs at a release point, on manual dispatch, or on a
    # batch branch - which is when the evidence is actually wanted.
    #
    # Everything here is expressed through the product's own CLI and the public
    # upstream sources, so this file carries no internal paths and no internal
    # tooling. The fuller, project-side acceptance suite lives outside the
    # repository (it is not a published artifact); this job is the part that has
    # to be machine-runnable and publicly visible.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || startsWith(github.ref, 'refs/heads/develop-v')
    strategy:
      fail-fast: false
      matrix:
        # linux/amd64 and linux/arm64. The script below is already architecture-aware
        # (`uname -m` picks the node archive), so the arm leg reuses it verbatim.
        include:
          - { runner: ubuntu-latest, arch: x64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: build the binary under test
        run: |
          # Static, as the published artifacts are.
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o /tmp/ployenv ./cmd/ployenv
          /tmp/ployenv --version
      - name: install, activate, inspect, uninstall (real filesystem, network allowed)
        run: |
          set -euo pipefail
          # A throw-away data root: the runner's own environment is never touched,
          # and the assertions below can rely on it being empty.
          export PLOYENV_ROOT="$(mktemp -d)"
          NODE_VERSION=20.20.2
          ARCH="$(uname -m)"
          case "$ARCH" in x86_64) NODE_ARCH=x64 ;; aarch64|arm64) NODE_ARCH=arm64 ;; *) NODE_ARCH="$ARCH" ;; esac

          # -y keeps the first-run setup non-interactive (there is no TTY here).
          /tmp/ployenv -y config --set-cache-keep true
          /tmp/ployenv -y install "node@$NODE_VERSION"

          # 1) an installed tool must be executable on a real filesystem
          test -x "$PLOYENV_ROOT/versions/node/$NODE_VERSION/bin/node"
          echo "PASS tool is executable"

          # 2) the downloaded bytes must match the checksum the upstream publishes
          archive="$(find "$PLOYENV_ROOT/cache" -name '*.tar.gz' -type f | head -1)"
          test -n "$archive"
          curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/SHASUMS256.txt" -o /tmp/sums.txt
          want="$(grep "node-v$NODE_VERSION-linux-$NODE_ARCH.tar.gz\$" /tmp/sums.txt | awk '{print $1}')"
          got="$(sha256sum "$archive" | awk '{print $1}')"
          test "$want" = "$got"
          echo "PASS archive sha256 = $got (matches upstream)"

          # 3) the rendered shell environment must work in a real POSIX shell
          /tmp/ployenv use "node@$NODE_VERSION"
          eval "$(/tmp/ployenv env --shell bash)"
          case "$(command -v node)" in
            "$PLOYENV_ROOT"/*) echo "PASS node resolves inside the managed root" ;;
            *) echo "::error::node does not resolve to the managed install"; exit 1 ;;
          esac
          node --version

          # 4) the reporting commands agree with what was installed
          /tmp/ployenv current node
          /tmp/ployenv which node
          /tmp/ployenv doctor --json

          # 5) and it must clean up after itself
          /tmp/ployenv uninstall "node@$NODE_VERSION"
          test ! -d "$PLOYENV_ROOT/versions/node/$NODE_VERSION"
          echo "PASS uninstall left no version directory"

          { echo "ployenv: $(/tmp/ployenv --version)"; echo "runner arch: $ARCH"; echo "node: $NODE_VERSION"; echo "archive sha256: $got"; echo "upstream sha256: $want"; } > /tmp/e2e-report.txt
      - name: keep the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-linux-report-${{ matrix.arch }}
          path: /tmp/e2e-report.txt
          if-no-files-found: warn

  e2e-windows-arm:
    name: e2e windows (arm64)
    # NFR-806 says every platform we publish an asset for needs one real end-to-end pass in CI, and
    # cross-compiling plus seam tests do not count. The linux half runs in e2e-linux (both ubuntu
    # runners); darwin has e2e-macos; this is the windows/arm64 half. Like the others it is written
    # purely against the product's own CLI and the public upstream sources, so it carries no
    # internal paths and no internal tooling.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || startsWith(github.ref, 'refs/heads/develop-v')
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: build the binary under test
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $bin = Join-Path $env:RUNNER_TEMP 'ployenv.exe'
          go build -trimpath -ldflags '-s -w' -o $bin ./cmd/ployenv
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          & $bin --version
      - name: install, activate, inspect, uninstall (real filesystem, network allowed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:RUNNER_TEMP 'ployenv.exe'
          # The job name claims arm64, so the runner has to actually be that.
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw "expected an arm64 runner, got $env:PROCESSOR_ARCHITECTURE" }

          # A throw-away data root: the runner's own environment is never touched.
          $root = Join-Path $env:RUNNER_TEMP ('ployenv-e2e-' + [guid]::NewGuid().ToString('N').Substring(0, 8))
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:PLOYENV_ROOT = $root
          $nodeVersion = '20.20.2'

          # -y keeps the first-run setup non-interactive (there is no TTY here).
          & $bin -y config --set-cache-keep true
          if ($LASTEXITCODE -ne 0) { throw 'config failed' }
          & $bin -y install "node@$nodeVersion"
          if ($LASTEXITCODE -ne 0) { throw 'install failed' }

          # 1) the installed tool must exist and actually run on this machine
          $nodeExe = Join-Path $root "versions\node\$nodeVersion\node.exe"
          if (-not (Test-Path -LiteralPath $nodeExe)) { throw "the installed tool is missing: $nodeExe" }
          $reported = (& $nodeExe --version | Out-String).Trim()
          Write-Host "installed node reports: $reported"
          if ($reported -ne "v$nodeVersion") { throw "expected v$nodeVersion, got $reported" }
          Write-Host 'PASS installed tool exists and runs'

          # 2) the downloaded bytes must match the checksum the upstream publishes
          $cache = Join-Path $root 'cache'
          $archive = @(Get-ChildItem -LiteralPath $cache -Recurse -File -Filter '*.zip' | Sort-Object Length -Descending) | Select-Object -First 1
          if ($null -eq $archive) { throw "no .zip was kept under $cache" }
          $name = $archive.Name
          $sums = Join-Path $env:RUNNER_TEMP 'SHASUMS256.txt'
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$nodeVersion/SHASUMS256.txt" -OutFile $sums
          $want = $null
          foreach ($line in (Get-Content -LiteralPath $sums)) {
            if ($line -match '^\s*([0-9A-Fa-f]{64})\s+(.+?)\s*$' -and $Matches[2] -eq $name) { $want = $Matches[1].ToLower() }
          }
          if ($null -eq $want) { throw "the upstream checksums do not list $name" }
          $got = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) { throw "$name is $want upstream but $got on disk" }
          Write-Host "PASS archive sha256 = $got (matches upstream)"

          # 3) the rendered session environment must work in this very shell
          & $bin use "node@$nodeVersion"
          if ($LASTEXITCODE -ne 0) { throw 'use failed' }
          Invoke-Expression (& $bin env --shell pwsh | Out-String)
          $resolved = (Get-Command node -ErrorAction SilentlyContinue).Source
          if ($null -eq $resolved) { throw 'node is not on PATH after evaluating the session environment' }
          if (-not $resolved.StartsWith($root, [StringComparison]::OrdinalIgnoreCase)) { throw "node resolves outside the managed root: $resolved" }
          Write-Host "PASS node resolves inside the managed root"
          & node --version

          # 4) the reporting commands must agree with what was installed
          & $bin current node
          & $bin which node
          $doc = (& $bin doctor --json | Out-String) | ConvertFrom-Json
          if ($doc.os -ne 'windows' -or $doc.arch -ne 'arm64') { throw "doctor reports $($doc.os)/$($doc.arch), expected windows/arm64" }
          Write-Host 'PASS doctor --json reports windows/arm64'

          # 5) and it must clean up after itself
          & $bin uninstall "node@$nodeVersion"
          if ($LASTEXITCODE -ne 0) { throw 'uninstall failed' }
          if (Test-Path -LiteralPath (Join-Path $root "versions\node\$nodeVersion")) { throw 'uninstall left the version directory behind' }
          Write-Host 'PASS uninstall left no version directory'

          @(
            "ployenv: $((& $bin --version | Out-String).Trim())",
            "runner arch: $env:PROCESSOR_ARCHITECTURE",
            "node: $nodeVersion",
            "archive: $name",
            "archive sha256: $got",
            "upstream sha256: $want"
          ) | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'e2e-report.txt') -Encoding utf8
          $LASTEXITCODE = 0
      - name: keep the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-windows-arm64-report
          path: ${{ runner.temp }}/e2e-report.txt
          if-no-files-found: warn

  # Runtime matrix (REQ-009 B3): ci/e2e-runtimes.tsv is the only place a runtime
  # is named. The prepare job turns that table into a matrix, so adding rust or
  # gradle is one data row (plus an optional ci/checks/<name>.sh hook) and this
  # file does not change. Runtime semantics that cannot fit a row live in
  # ci/checks/<name>.sh|ps1 and are run right after their row.
  e2e-matrix-prepare:
    name: prepare the runtime matrix
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || startsWith(github.ref, 'refs/heads/develop-v')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: read the runtime table
        id: read
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, pathlib, subprocess

          rows = []
          for line in pathlib.Path("ci/e2e-runtimes.tsv").read_text(encoding="utf-8").splitlines():
              if not line.strip() or line.lstrip().startswith("#"):
                  continue
              name, version, tool, args, expect, requires = line.split("\t")
              rows.append({"name": name, "version": version, "tool": tool,
                           "args": args, "expect": expect, "requires": requires})

          # One entry per platform. Runtime growth is free (one row); adding a
          # PLATFORM is the one-time cost here plus one step pair in e2e-runtime
          # (the shell differs), which is why the matrix carries shell/os.
          platforms = [("ubuntu-latest", "bash", "linux"), ("windows-11-arm", "pwsh", "windows")]

          # A release point runs every row; otherwise only the rows whose
          # internal/runtime/<name>.go changed. The fallback below is load-bearing:
          # a tag build diffs to an empty set, and an edit to registry.go/spec.go
          # matches no stem, so "no rows picked" means "run everything".
          picked = rows
          if os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch":
              tag = subprocess.run(["git", "describe", "--tags", "--abbrev=0"],
                                   capture_output=True, text=True).stdout.strip()
              if tag:
                  changed = subprocess.run(
                      ["git", "diff", "--name-only", tag + "..HEAD", "--", "internal/runtime"],
                      capture_output=True, text=True).stdout
                  names = {pathlib.Path(p).stem for p in changed.split() if p.endswith(".go")}
                  narrowed = [r for r in rows if r["name"] in names]
                  if narrowed:
                      picked = narrowed

          include = [dict(row, runner=runner, shell=shell, os=kind)
                     for row in picked for runner, shell, kind in platforms]
          print("matrix=" + json.dumps({"include": include}))
          PY
          # Fail here instead of handing an empty matrix to the next job.
          grep -q '"include": \[{' "$GITHUB_OUTPUT" || { echo '::error::the runtime table produced an empty matrix'; exit 1; }

  e2e-runtime:
    name: e2e ${{ matrix.name }} (${{ matrix.os }})
    needs: e2e-matrix-prepare
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || startsWith(github.ref, 'refs/heads/develop-v')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e-matrix-prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      # A fixed root (not mktemp) so the cache below can hold this row's install.
      PLOYENV_ROOT: ${{ github.workspace }}/.ployenv-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: restore this row's runtime cache
        uses: actions/cache@v4
        with:
          path: .ployenv-e2e
          key: e2e-${{ matrix.os }}-${{ matrix.name }}-${{ matrix.version }}-${{ matrix.requires }}
      - name: build the binary under test (linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o /tmp/ployenv ./cmd/ployenv
          /tmp/ployenv --version
      - name: build the binary under test (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $bin = Join-Path $env:RUNNER_TEMP 'ployenv.exe'
          go build -trimpath -ldflags '-s -w' -o $bin ./cmd/ployenv
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          & $bin --version
      - name: one row of the table, end to end (linux)
        if: matrix.os == 'linux'
        shell: bash
        env:
          ROW_NAME: ${{ matrix.name }}
          ROW_VERSION: ${{ matrix.version }}
          ROW_TOOL: ${{ matrix.tool }}
          ROW_ARGS: ${{ matrix.args }}
          ROW_EXPECT: ${{ matrix.expect }}
          ROW_REQUIRES: ${{ matrix.requires }}
          PLOYENV_BIN: /tmp/ployenv
        run: |
          set -euo pipefail
          mkdir -p "$PLOYENV_ROOT"
          "$PLOYENV_BIN" -y config --set-cache-keep true
          if [ "$ROW_REQUIRES" != "-" ]; then
            "$PLOYENV_BIN" -y install "$ROW_REQUIRES"
            "$PLOYENV_BIN" use "$ROW_REQUIRES"
          fi
          "$PLOYENV_BIN" -y install "$ROW_NAME@$ROW_VERSION"
          "$PLOYENV_BIN" use "$ROW_NAME@$ROW_VERSION"
          eval "$("$PLOYENV_BIN" env --shell bash)"
          out="$("$ROW_TOOL" $ROW_ARGS 2>&1 || true)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Eq "$ROW_EXPECT" || {
            echo "::error::$ROW_NAME: expected /$ROW_EXPECT/ from '$ROW_TOOL $ROW_ARGS'"
            exit 1
          }
          echo "PASS $ROW_NAME: $(printf '%s' "$out" | head -1)"
          hook="ci/checks/$ROW_NAME.sh"
          if [ -f "$hook" ]; then bash "$hook"; fi
      - name: one row of the table, end to end (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          ROW_NAME: ${{ matrix.name }}
          ROW_VERSION: ${{ matrix.version }}
          ROW_TOOL: ${{ matrix.tool }}
          ROW_ARGS: ${{ matrix.args }}
          ROW_EXPECT: ${{ matrix.expect }}
          ROW_REQUIRES: ${{ matrix.requires }}
          PLOYENV_BIN: ${{ runner.temp }}\ployenv.exe
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:PLOYENV_ROOT | Out-Null
          & $env:PLOYENV_BIN -y config --set-cache-keep true
          if ($LASTEXITCODE -ne 0) { throw 'config failed' }
          if ($env:ROW_REQUIRES -ne '-') {
            & $env:PLOYENV_BIN -y install $env:ROW_REQUIRES
            if ($LASTEXITCODE -ne 0) { throw 'install requires failed' }
            & $env:PLOYENV_BIN use $env:ROW_REQUIRES
            if ($LASTEXITCODE -ne 0) { throw 'use requires failed' }
          }
          & $env:PLOYENV_BIN -y install "$($env:ROW_NAME)@$($env:ROW_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'install failed' }
          & $env:PLOYENV_BIN use "$($env:ROW_NAME)@$($env:ROW_VERSION)"
          if ($LASTEXITCODE -ne 0) { throw 'use failed' }
          Invoke-Expression (& $env:PLOYENV_BIN env --shell pwsh | Out-String)
          $out = (& $env:ROW_TOOL $env:ROW_ARGS 2>&1 | Out-String)
          $out
          if ($out -notmatch $env:ROW_EXPECT) { throw "$($env:ROW_NAME): expected /$($env:ROW_EXPECT)/ from '$($env:ROW_TOOL) $($env:ROW_ARGS)'" }
          Write-Host "PASS $($env:ROW_NAME): $(($out -split "`n")[0].Trim())"
          $hook = Join-Path 'ci/checks' ($env:ROW_NAME + '.ps1')
          if (Test-Path -LiteralPath $hook) { . $hook }

  e2e-all:
    name: e2e every runtime in one shell (manual)
    # The parallel matrix gives every row its own data root; this lane is the
    # coexistence case (one root, one eval, every runtime active at once).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: build the binary under test
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o /tmp/ployenv ./cmd/ployenv
          /tmp/ployenv --version
      - name: install every row into one data root and run them together
        run: |
          set -euo pipefail
          export PLOYENV_ROOT="$(mktemp -d)"
          export PLOYENV_BIN=/tmp/ployenv
          "$PLOYENV_BIN" -y config --set-cache-keep true
          while IFS=$'\t' read -r name version tool args expect requires; do
            case "$name" in ''|'#'*) continue ;; esac
            [ "$requires" = "-" ] || { "$PLOYENV_BIN" -y install "$requires"; "$PLOYENV_BIN" use "$requires"; }
            "$PLOYENV_BIN" -y install "$name@$version"
            "$PLOYENV_BIN" use "$name@$version"
          done < ci/e2e-runtimes.tsv
          eval "$("$PLOYENV_BIN" env --shell bash)"
          while IFS=$'\t' read -r name version tool args expect requires; do
            case "$name" in ''|'#'*) continue ;; esac
            out="$("$tool" $args 2>&1 || true)"
            printf '%s\n' "$out" | grep -Eq "$expect" || { echo "::error::$name: expected /$expect/ from '$tool $args'"; exit 1; }
            if [ -f "ci/checks/$name.sh" ]; then bash "ci/checks/$name.sh"; fi
            echo "PASS $name: $(printf '%s' "$out" | head -1)"
          done < ci/e2e-runtimes.tsv
          "$PLOYENV_BIN" doctor --json > /dev/null
          echo 'PASS every runtime active in one shell'

  e2e-macos:
    name: e2e macos
    # The darwin counterpart of e2e-linux, for the same reason: it downloads a
    # runtime, so it is not part of the everyday gate. Like the linux job it is
    # expressed through the product's own CLI and the public upstream sources,
    # so this file carries no internal paths and no internal tooling.
    #
    # Gatekeeper and quarantine handling is a documentation matter for now (the
    # release is unsigned by decision), so this job only asserts what an
    # unsigned-but-intact install has to satisfy: the tool runs, and it carries
    # no quarantine attribute.
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
      || startsWith(github.ref, 'refs/heads/develop-v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: build the binary under test
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o "$RUNNER_TEMP/ployenv" ./cmd/ployenv
          "$RUNNER_TEMP/ployenv" --version
      - name: install, activate, inspect, uninstall (real filesystem, network allowed)
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/ployenv"
          # A throw-away data root: the runner's own environment is never touched,
          # and the assertions below can rely on it being empty.
          #
          # macOS gives out /var/folders/... paths, and /var is a symlink to
          # /private/var, so the root is resolved once: the install, the PATH the
          # product renders, and the assertions below then all agree on one form.
          export PLOYENV_ROOT="$(cd "$(mktemp -d)" && pwd -P)"
          NODE_VERSION=20.20.2
          ARCH="$(uname -m)"
          case "$ARCH" in arm64) NODE_ARCH=arm64 ;; x86_64) NODE_ARCH=x64 ;; *) NODE_ARCH="$ARCH" ;; esac
          # The job name claims darwin/arm64, so the runner has to actually be that.
          test "$ARCH" = "arm64"

          # -y keeps the first-run setup non-interactive (there is no TTY here).
          "$BIN" -y config --set-cache-keep true
          "$BIN" -y install "node@$NODE_VERSION"

          # 1) an installed tool must be executable on a real filesystem
          tool="$PLOYENV_ROOT/versions/node/$NODE_VERSION/bin/node"
          test -x "$tool"
          echo "PASS tool is executable"

          # 2) the downloaded bytes must match the checksum the upstream publishes
          archive="$(find "$PLOYENV_ROOT/cache" -name '*.tar.gz' -type f | head -1)"
          test -n "$archive"
          curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/SHASUMS256.txt" -o "$RUNNER_TEMP/sums.txt"
          want="$(grep "node-v$NODE_VERSION-darwin-$NODE_ARCH.tar.gz\$" "$RUNNER_TEMP/sums.txt" | awk '{print $1}')"
          got="$(shasum -a 256 "$archive" | awk '{print $1}')"
          test "$want" = "$got"
          echo "PASS archive sha256 = $got (matches upstream)"

          # 3) the rendered shell environment must work in a real POSIX shell
          "$BIN" use "node@$NODE_VERSION"
          eval "$("$BIN" env --shell bash)"
          case "$(command -v node)" in
            "$PLOYENV_ROOT"/*) echo "PASS node resolves inside the managed root" ;;
            *) echo "::error::node does not resolve to the managed install"; exit 1 ;;
          esac
          node --version

          # 4) the installed tool must really run on darwin, not merely exist -
          #    this is also what an unsigned/quarantined install would break
          "$tool" --version
          if xattr -p com.apple.quarantine "$tool" 2>/dev/null; then
            echo "::error::the installed tool carries a quarantine attribute"
            exit 1
          fi
          echo "PASS installed tool runs and is not quarantined"

          # 5) the reporting commands agree with what was installed
          "$BIN" current node
          "$BIN" which node
          "$BIN" doctor --json

          # 6) and it must clean up after itself
          "$BIN" uninstall "node@$NODE_VERSION"
          test ! -d "$PLOYENV_ROOT/versions/node/$NODE_VERSION"
          echo "PASS uninstall left no version directory"

          { echo "ployenv: $("$BIN" --version)"; echo "runner arch: $ARCH"; echo "node: $NODE_VERSION"; echo "archive sha256: $got"; echo "upstream sha256: $want"; } > "$RUNNER_TEMP/e2e-report.txt"
      - name: keep the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-macos-report
          path: ${{ runner.temp }}/e2e-report.txt
          if-no-files-found: warn

  plugin-smoke:
    name: dsh plugin smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: syntax check
        run: node --check dsh-plugin/index.js
      - name: stub smoke test
        run: node dsh-plugin/stub-smoke.mjs
