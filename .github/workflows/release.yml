name: release

# Release 流水线
#   发布的二进制就是仓库里那份 `dsh-plugin/bin/win32-x64/ployenv.exe`，CI **不重建**。
#   原因：重建会把「运行那一刻的提交」写进二进制的 `vcs.revision`，而内置件里固化的是它
#   自己那次构建的提交（v0.3.2 = `bfd58aac`、v0.3.3 = `69f8a85`）→ 字节必然不同 ——
#   「部署件 = 仓库内置件 = 构建产物」这条字节一致仪式会失效。
#   注：上面两个固化值是 2026-10-12 提交备注规范化之前的 SHA，规范化后已成孤儿对象（不在任何
#   分支历史上）；因此发布的资产**只认仓库里这一份内置件**，仓外校验按标签具名登记这两个例外。
#   本工作流只做三件事：跑门禁 → 用 build.ps1 -Package 摆出资产 → 独立复验后发布。
#
# 触发：
#   push v*           正式发布（推标签，整棵树就是标签树）
#   workflow_dispatch 补发历史标签；dry_run=true 时只校验、不碰 Release
#
# 补发的**真实**约束（2026-10-14 更正，原注释所述不成立）：打包脚本、版本常量、内置件必须来自**同一棵树**，
#   `build.ps1` 有两条断言会挡住跨版本补发 —— L159「内置件版本 != 源码版本」与 L123「-Version != 源码版本」。
#   所以：
#     ✓ 可补发：标签的版本 == 被派发分支的版本（等价于「从该标签自身派发」，且该标签的树里已有 `-Package`）
#     ✗ 不可补发：v0.3.2 这类**旧标签** —— 它的树里没有 `build.ps1 -Package`，而派发分支（如 main=0.3.3）
#       的版本又与之不同，两条断言必然拦下。该情况下请勿再试；需要的话另行决定（例如手工上传资产）。
#   这正是 2026-10-14 演练 run #6 失败的根因（派发时 tag 填了 v0.3.2 而分支是 0.3.3）。
#
# Assets (each Release, flat, never zipped; REQ-008 FR-802 / 3.1):
#   ployenv-v<ver>-<goos>-<goarch>[.exe]   six of them. windows/amd64 IS the binary committed in
#                                          this repository (the identity anchor); the other five
#                                          are built by CI from the tree of the tag with
#                                          CGO_ENABLED=0 -trimpath -ldflags '-s -w'
#   ployenv-<goos>-<goarch>[.exe]          the fixed-name alias of each of those six, for
#                                          releases/latest/download (REQ-003 FR-303's default source)
#   LICENSE
#   SHA256SUMS.txt                         one file, listing all thirteen assets (FR-802 v1.4)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的注释标签，必须与被派发分支的版本一致（分支是 0.3.3 就填 v0.3.3）；仅补发历史标签才填旧标签"
        required: true
        type: string
      dry_run:
        description: "只校验，不创建/更新 Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: package and publish
    runs-on: windows-latest
    steps:
      - name: checkout the tree that provides the packaging script
        uses: actions/checkout@v4
        with:
          # push a tag: the tagged tree itself. workflow_dispatch: the dispatched ref, because a
          # historical tag predates `build.ps1 -Package` (v0.3.2 does) and could not package
          # itself - the next step then pins the BINARY back to the tag.
          ref: ${{ github.event_name == 'push' && github.ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: resolve the release tag
        id: rel
        shell: pwsh
        run: |
          # Every failing step in this workflow annotates its reason: a failed step's log is not
          # readable through the API or by a non-admin, so "Process completed with exit code 1" is
          # all anyone gets otherwise (run #6 cost a full round of guessing for exactly that reason).
          trap { Write-Host "::error::$($_.Exception.Message)"; exit 1 }
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') { throw "unexpected release tag: '$tag'" }
          $version = $tag.TrimStart('v')

          # Fail fast and in plain words when the requested tag and the checked-out tree disagree.
          # The packaging script, the version constant and the bundled binary all have to come from
          # one tree, so this is not recoverable further down: build.ps1 would only die in the middle
          # of packaging with "expected version X, but this tree says Y", leaving whoever dispatched
          # the run with no idea what to do about it (that is exactly what happened on run #6).
          $srcVersion = (Select-String -LiteralPath 'internal/cli/cli.go' -Pattern 'const Version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($srcVersion -ne $version) {
            $hint = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              "This workflow packages the tree it checks out, so the tag has to match that tree: dispatch from '$tag' itself, or from a branch whose version is $version."
            } else {
              "A tag push checks out the tagged tree, so the tag and its own tree have to agree - this one does not."
            }
            throw "version mismatch: the checked-out tree is $srcVersion but the tag is $tag ($version). $hint"
          }
          Write-Host "PASS tag-matches-tree  $tag ($version)"

          "tag=$tag"         >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "tag=$tag version=$version"

      - name: pin the bundled binary to the release tag (backfill)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          trap { Write-Host "::error::$($_.Exception.Message)"; exit 1 }
          # Backfilling an existing tag: the packaging script comes from the dispatched ref (an old
          # tag predates it, v0.3.2 does), but the BINARY has to come from the tag itself - otherwise
          # the published asset would not be the one that tag shipped.
          $tag = '${{ steps.rel.outputs.tag }}'
          & git checkout $tag -- dsh-plugin/bin/win32-x64/ployenv.exe
          if ($LASTEXITCODE -ne 0) { throw "cannot materialise the bundled binary of $tag" }
          Write-Host "bundled binary materialised from $tag"

      - name: build gates + lay out the release assets
        shell: pwsh
        run: |
          # Self-diagnosing on purpose. A failed step's log is not readable through the API or by a
          # non-admin, so the reason has to reach the annotation: without this, the only thing anyone
          # sees is "Process completed with exit code 1" and the next person has to guess (run #6 cost
          # a full round of guessing for exactly this reason).
          trap { Write-Host "::error::release packaging failed: $($_.Exception.Message)"; exit 1 }
          ./build.ps1 -Test -Package -Version '${{ steps.rel.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::build.ps1 -Test -Package exited $LASTEXITCODE"; exit $LASTEXITCODE }
          Write-Host 'PASS build.ps1 -Test -Package'

      - name: verify the assets (option B)
        shell: pwsh
        run: |
          # Same reason as the packaging step above: every assertion here is a throw, and a throw
          # that only reaches the log is invisible to whoever has to act on it.
          trap { Write-Host "::error::asset verification failed: $($_.Exception.Message)"; exit 1 }
          # NOTE: this block is deliberately ASCII-only. The runner writes a run block to a
          # temporary .ps1 file; if that file is read as ANSI (Windows PowerShell 5.1 does when
          # there is no BOM), a non-ASCII comment can swallow the next line - a trap this project
          # has already been bitten by. The workspace-level checker (10_release-assets) cannot run
          # here because it does not live in this repository, so the same checks are inlined; that
          # checker remains the independent second pair of eyes at handoff time.
          $version = '${{ steps.rel.outputs.version }}'
          $dir = 'dist/release'
          $bundled = 'dsh-plugin/bin/win32-x64/ployenv.exe'
          $targets = @('windows-amd64', 'windows-arm64', 'linux-amd64', 'linux-arm64', 'darwin-amd64', 'darwin-arm64')

          # The asset set must be exactly these: six versioned binaries, the six fixed-name aliases
          # of the same bytes, LICENSE, and one SHA256SUMS.txt covering all thirteen (FR-802 v1.4).
          $expected = @()
          foreach ($t in $targets) {
            $ext = if ($t -like 'windows-*') { '.exe' } else { '' }
            $expected += "ployenv-v$version-$t$ext"
            $expected += "ployenv-$t$ext"
          }
          $expected += 'LICENSE'
          $expected += 'SHA256SUMS.txt'
          $actual = @(Get-ChildItem -LiteralPath $dir -File | Select-Object -ExpandProperty Name)
          if (Compare-Object $expected $actual) { throw "unexpected asset set: $($actual -join ', ')" }

          # windows/amd64 is the one asset that must be byte-identical to the binary committed in
          # this repository: it is the identity anchor of the release (owner decision, option B).
          $hBundled = (Get-FileHash -LiteralPath $bundled -Algorithm SHA256).Hash
          $hExe = (Get-FileHash -LiteralPath "$dir/ployenv-v$version-windows-amd64.exe" -Algorithm SHA256).Hash
          if ($hExe -ne $hBundled) { throw "published windows/amd64 ($hExe) differs from the bundled binary ($hBundled)" }
          Write-Host "PASS asset-vs-bundled  $hExe"

          # Every alias must be the same bytes as its own versioned asset (never a second build).
          foreach ($t in $targets) {
            $ext = if ($t -like 'windows-*') { '.exe' } else { '' }
            $v = (Get-FileHash -LiteralPath "$dir/ployenv-v$version-$t$ext" -Algorithm SHA256).Hash
            $a = (Get-FileHash -LiteralPath "$dir/ployenv-$t$ext" -Algorithm SHA256).Hash
            if ($a -ne $v) { throw "the alias of $t differs from its versioned asset" }
            Write-Host "PASS alias-vs-versioned  $t"
          }

          # A name has to match its bytes: the first four bytes identify the format, so a mix-up
          # between targets (a linux build published under a darwin name, say) is caught here. The
          # sums file cannot catch that - it only proves the bytes did not change after packaging.
          foreach ($t in $targets) {
            $ext = if ($t -like 'windows-*') { '.exe' } else { '' }
            $head = [byte[]]::new(4)
            $stream = [IO.File]::OpenRead("$dir/ployenv-v$version-$t$ext")
            try { [void]$stream.Read($head, 0, 4) } finally { $stream.Dispose() }
            $hex = (($head | ForEach-Object { $_.ToString('X2') }) -join ' ')
            $ok = $false
            if ($t -like 'windows-*') { $ok = $hex -like '4D 5A*' }
            elseif ($t -like 'linux-*') { $ok = $hex -eq '7F 45 4C 46' }
            elseif ($t -like 'darwin-*') { $ok = @('CF FA ED FE', 'CE FA ED FE', 'FE ED FA CF') -contains $hex }
            if (-not $ok) { throw "the $t asset is not a $t image (first bytes: $hex)" }
            Write-Host "PASS asset-kind  $t ($hex)"
          }

          # SHA256SUMS.txt: trust only what the file says, and recompute every line
          $n = 0
          foreach ($line in (Get-Content -LiteralPath "$dir/SHA256SUMS.txt")) {
            if ($line -eq '' -or $line.StartsWith('#')) { continue }
            if ($line -notmatch '^([0-9A-Fa-f]{64})\s+(.+)$') { throw "malformed line in SHA256SUMS.txt: $line" }
            $want = $Matches[1]
            $name = $Matches[2].Trim()
            $got = (Get-FileHash -LiteralPath (Join-Path $dir $name) -Algorithm SHA256).Hash
            if ($got -ne $want) { throw "SHA256SUMS.txt mismatch for $name" }
            $n++
          }
          if ($n -ne 13) { throw "SHA256SUMS.txt covers $n files, expected 13" }
          Write-Host "PASS sha256sums  13/13 recomputed from disk"

          # tag version = code version (build.ps1 -Version checked it once; this checks the tag)
          $srcVersion = (Select-String -LiteralPath 'internal/cli/cli.go' -Pattern 'const Version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($srcVersion -ne $version) { throw "tag says $version but internal/cli/cli.go says $srcVersion" }
          Write-Host "PASS version  $version"

      - name: create or update the GitHub Release
        if: ${{ github.event_name == 'push' || inputs.dry_run != true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Publishing is the step where a silent failure hurts most, so its reason is annotated too.
          trap { Write-Host "::error::publishing the release failed: $($_.Exception.Message)"; exit 1 }
          $tag = '${{ steps.rel.outputs.tag }}'
          $version = '${{ steps.rel.outputs.version }}'
          $dir = 'dist/release'
          # Whatever the packaging step laid out, minus nothing: six versioned binaries, six
          # fixed-name aliases, LICENSE and one SHA256SUMS.txt.
          $assets = @(Get-ChildItem -LiteralPath $dir -File | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 14) { throw "expected 14 files in ${dir}, found $($assets.Count)" }
          foreach ($a in $assets) { if (-not (Test-Path -LiteralPath $a)) { throw "missing asset: $a" } }

          # the annotated tag message is the release note
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          (& git tag -l --format='%(contents)' $tag) | Set-Content -LiteralPath $notes -Encoding utf8

          # Assert the note we are about to publish IS the annotated tag message (REQ-004 FR-405 /
          # I-17). Line endings and trailing whitespace are normalised first - git emits LF while the
          # file write may use CRLF - but nothing else is allowed to differ. This exists because a
          # silent mid-line truncation is invisible in the UI and was only caught by an independent
          # review of the live Release page.
          $normalise = { param($text) ($text -replace "`r`n", "`n").TrimEnd() }
          $expectedNotes = (& git tag -l --format='%(contents)' $tag | Out-String)
          # read with an explicit encoding: Get-Content would use the reader's default and a
          # BOM-less UTF-8 note file is mojibake under Windows PowerShell 5.1 (which turns this
          # assertion into a false alarm - or worse, a false pass - depending on the shell).
          $actualNotes = [IO.File]::ReadAllText($notes, [Text.Encoding]::UTF8)
          if ((& $normalise $expectedNotes) -ne (& $normalise $actualNotes)) {
            $exp = (& $normalise $expectedNotes) -split "`n"
            $act = (& $normalise $actualNotes) -split "`n"
            $at = 1
            while ($at -le $exp.Count -and $at -le $act.Count -and $exp[$at - 1] -eq $act[$at - 1]) { $at++ }
            throw "the release notes differ from the annotated tag message of $tag (first difference at line $at)"
          }
          Write-Host "PASS notes-match-tag-message  $($actualNotes.Length) chars"

          & gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag already exists -> refreshing assets and notes"
            & gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }
            & gh release edit $tag --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'gh release edit failed' }
          } else {
            & gh release create $tag --title "ployenv $tag" --notes-file $notes @assets
            if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          }

          & gh release view $tag
          if ($LASTEXITCODE -ne 0) { throw 'gh release view failed' }

          # leave evidence in the run summary (with the asset hashes), readable without the logs
          $anchor = "$dir/ployenv-v$version-windows-amd64.exe"
          @(
            "## release $tag",
            "",
            "- windows/amd64: option B (the binary committed in this repository; CI never rebuilds it)",
            "- the other five targets: built by CI from the tree of $tag, CGO_ENABLED=0 -trimpath -ldflags '-s -w'",
            "- assets: six versioned binaries, their six fixed-name aliases for ``latest/download``, ``LICENSE``, one ``SHA256SUMS.txt``",
            "- windows/amd64 SHA-256: ``$((Get-FileHash -LiteralPath $anchor -Algorithm SHA256).Hash)``",
            "",
            "### SHA256SUMS.txt",
            "",
            '```',
            (Get-Content -LiteralPath "$dir/SHA256SUMS.txt" -Raw).TrimEnd(),
            '```'
          ) >> $env:GITHUB_STEP_SUMMARY
